[project]
name = "reporte-variaciones"
version = "0.1.0"
description = "Indice de variaciones de precios sobre los datos capturados de SEPA"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "google-cloud-storage>=2.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pandas>=2.0", "xlrd>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
