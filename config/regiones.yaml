# Mapeo provincia -> region estadistica del INDEC.
#
# El IPC publica seis regiones (Cuadro 5 de docs/metodologia_ipc_nacional_2019.pdf).
# Cinco se resuelven con la provincia sola. Buenos Aires NO:
#
#   GBA      = CABA + los 24 partidos del Gran Buenos Aires
#   Pampeana = el resto de la provincia de Buenos Aires + Cordoba, Entre Rios,
#              La Pampa y Santa Fe
#
# Juntas pesan el 78,9% del total nacional (GBA 0,447 + Pampeana 0,342), asi que
# no es un detalle menor: sin poder separarlas, el indice regional no se puede
# comparar contra el del INDEC.
#
# RESUELTO el 21/10/2026: captura publica `staged/sucursales/` con el
# departamento (partido) de cada sucursal, que saca del API georef del Estado por
# sus coordenadas (`precios.cli publicar-sucursales`). Que partido es GBA lo
# decide este repo, con `partidos_gba_ids`. Una sucursal bonaerense sin partido
# no se adivina: queda sin region (ver `reporte.regiones.region_de_sucursal`).

version: 1

# Region a la que pertenece cada provincia, por su nombre en el maestro de SEPA.
provincias:
  CABA:                   GBA
  Buenos Aires:           REQUIERE_LOCALIDAD    # se parte entre GBA y Pampeana
  Córdoba:                Pampeana
  Entre Ríos:             Pampeana
  La Pampa:               Pampeana
  Santa Fe:               Pampeana
  Corrientes:             Noreste
  Chaco:                  Noreste
  Formosa:                Noreste
  Misiones:               Noreste
  Catamarca:              Noroeste
  Jujuy:                  Noroeste
  La Rioja:               Noroeste
  Salta:                  Noroeste
  Santiago del Estero:    Noroeste
  Tucumán:                Noroeste
  Mendoza:                Cuyo
  San Juan:               Cuyo
  San Luis:               Cuyo
  Chubut:                 Patagonia
  Neuquén:                Patagonia
  Río Negro:              Patagonia
  Santa Cruz:             Patagonia
  Tierra del Fuego:       Patagonia

