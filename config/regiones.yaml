# Mapeo provincia -> region estadistica del INDEC.
#
# El IPC publica seis regiones (Cuadro 5 de docs/metodologia_ipc_nacional_2019.pdf).
# Cinco se resuelven con la provincia sola. Buenos Aires NO:
#
#   GBA      = CABA + los 24 partidos del Gran Buenos Aires
#   Pampeana = el resto de la provincia de Buenos Aires + Cordoba, Entre Rios,
#              La Pampa y Santa Fe
#
# Juntas pesan el 78,9% del total nacional (GBA 0,447 + Pampeana 0,342), asi que
# no es un detalle menor: sin poder separarlas, el indice regional no se puede
# comparar contra el del INDEC.
#
# PROBLEMA ABIERTO: staged/observaciones del repo de captura tiene `provincia`
# pero no `localidad` ni codigo postal. Para resolver Buenos Aires hace falta
# agregar alla una dimension de sucursales. Hasta entonces, las sucursales
# bonaerenses caen en `INDETERMINADA` y hay que decidir si se excluyen o se
# imputan a Pampeana.

version: 1

# Region a la que pertenece cada provincia, por su nombre en el maestro de SEPA.
provincias:
  CABA:                   GBA
  Buenos Aires:           REQUIERE_LOCALIDAD    # se parte entre GBA y Pampeana
  Córdoba:                Pampeana
  Entre Ríos:             Pampeana
  La Pampa:               Pampeana
  Santa Fe:               Pampeana
  Corrientes:             Noreste
  Chaco:                  Noreste
  Formosa:                Noreste
  Misiones:               Noreste
  Catamarca:              Noroeste
  Jujuy:                  Noroeste
  La Rioja:               Noroeste
  Salta:                  Noroeste
  Santiago del Estero:    Noroeste
  Tucumán:                Noroeste
  Mendoza:                Cuyo
  San Juan:               Cuyo
  San Luis:               Cuyo
  Chubut:                 Patagonia
  Neuquén:                Patagonia
  Río Negro:              Patagonia
  Santa Cruz:             Patagonia
  Tierra del Fuego:       Patagonia

# Los 24 partidos que el INDEC cuenta como GBA. Una sucursal de la provincia de
# Buenos Aires cuya localidad este en esta lista va a GBA; el resto, a Pampeana.
partidos_gba:
  - Almirante Brown
  - Avellaneda
  - Berazategui
  - Esteban Echeverría
  - Ezeiza
  - Florencio Varela
  - General San Martín
  - Hurlingham
  - Ituzaingó
  - José C. Paz
  - La Matanza
  - Lanús
  - Lomas de Zamora
  - Malvinas Argentinas
  - Merlo
  - Moreno
  - Morón
  - Quilmes
  - San Fernando
  - San Isidro
  - San Miguel
  - Tigre
  - Tres de Febrero
  - Vicente López

# Peso de cada region sobre el total nacional.
#
# Fuente: fila "Importancia relativa de la region en el total nacional" de la
# hoja Ponderaciones de sh_ipc_aperturas.xls (INDEC). Antes estaban a 3 decimales
# y sumaban 1,001; estos suman 1,0000 exacto.
#
# Sirven para pasar de ponderadores por region a NACIONALES:
#
#     peso_nacional(clase) = suma( peso_region x ponderador_region(clase) )
#
# Hace falta porque la muestra de precios es de todo el pais mezclado: aplicarle
# los ponderadores de GBA seria asumir que solo medimos GBA.
#
# OJO: estos pesos salen de la ENGHo 2004/05, igual que los ponderadores del
# INDEC. NO se usan para los pesos de la ENGHo 2017/18 — ahi se suma el gasto de
# las seis regiones directo, porque mezclar las dos encuestas seria incoherente.
# Ver el comentario de REGION_NACIONAL en src/reporte/ponderadores.py.
pesos_regionales:
  GBA:        0.4467
  Pampeana:   0.3419
  Noroeste:   0.0688
  Cuyo:       0.0518
  Patagonia:  0.0457
  Noreste:    0.0451
