# Nuestro articulo ENGHo -> el producto que el INDEC publica con precio promedio.
#
# PARA QUE SIRVE
# El INDEC publica todos los meses el precio promedio de ~60 productos en GBA
# (sh_ipc_precios_promedio.xls, hoja "GBA"). Los que tienen par con un articulo
# nuestro permiten comparar producto por producto, que son 32 puntos y no uno:
# un umbral del filtro, una cadena que pesa de mas o un producto mal medido se
# ven aca antes que en el agregado (ver reporte.contra_indec).
#
# OJO: nuestro articulo es nacional y el precio promedio del INDEC es de GBA. Y
# el producto del INDEC es una especificacion fija ("Aceite de girasol, botella
# de 1,5 litros"); nuestro articulo junta todas las presentaciones. Sirve para
# ver en que direccion y por cuanto nos alejamos, no para exigir el mismo numero.
#
# Los nombres son EXACTOS, como estan en la planilla. Armado el 21/10/2026.

