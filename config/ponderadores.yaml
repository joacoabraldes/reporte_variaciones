# Ponderaciones del IPC nacional del INDEC, base diciembre 2016.
# Extraido de docs/ponderadores_ipc.xls (fuente: INDEC).
#
# Estructura COICOP: division -> grupo -> clase. Los codigos coinciden
# exactamente con los que usa config/categorias.yaml, asi que el join es directo.
#
# Los pesos son sobre el TOTAL de la canasta (nivel general = 1.0). Como el
# indice cubre solo una parte, hay que RENORMALIZAR sobre las clases
# efectivamente cubiertas antes de agregar hacia arriba.

base: diciembre 2016
fuente: INDEC - Direccion de Indices de Precios de Consumo

