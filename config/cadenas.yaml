# Cadenas con catálogo online, y su identidad en SEPA.
#
# El `id_comercio` es el código de informante que usa SEPA. No es adivinable:
# sale de leer `comercio_nombre` en las observaciones de un día. Los que están
# en `null` todavía no se identificaron.
#
# `plataforma: vtex` significa que el catálogo se lee con un pedido a
# `/api/catalog_system/pub/products/search/{termino}`, que devuelve por producto
# el EAN, la marca, la categoría y los dos precios. No hay que parsear HTML.
#
# Las que figuran en `sin_api` se verificaron a mano y NO sirven por esa vía:
# anotarlo acá evita que alguien vuelva a perder la tarde probándolas.

version: 1

cadenas:

  dia:
    nombre: Supermercados DIA
    host: diaonline.supermercadosdia.com.ar
    plataforma: vtex
    id_comercio: "15"
    sucursales_en_sepa: 975

  vea:
    nombre: Vea (Cencosud)
    host: www.vea.com.ar
    plataforma: vtex
    id_comercio: "9"
    sucursales_en_sepa: 268

  jumbo:
    nombre: Jumbo (Cencosud)
    host: www.jumbo.com.ar
    plataforma: vtex
    # Cencosud aparece en SEPA por bandera: Vea es el 9. Falta identificar si
    # Jumbo informa aparte o va adentro del mismo informante.
    id_comercio: null

  disco:
    nombre: Disco (Cencosud)
    host: www.disco.com.ar
    plataforma: vtex
    id_comercio: null

  farmacity:
    nombre: Farmacity
    host: www.farmacity.com
    plataforma: vtex
    # Es informante de SEPA (el 24), aunque el indice la excluye por tener poco
    # surtido comparable (ver config/comercios.yaml del repo de captura). Por
    # eso es la unica tienda no-super del relevamiento online que se puede
    # calibrar contra lo que declara por ley.
    id_comercio: "24"

sin_api:

  coto:
    nombre: COTO CICSA
    id_comercio: "12"
    # cotodigital3.com.ar redirige a coto.com.ar, y esa ruta devuelve el HTML de
    # una aplicación de página única, no el catálogo. Haría falta otra forma.
    motivo: no es VTEX, la tienda es una SPA

  laanonima:
    nombre: La Anonima
    id_comercio: "2"
    motivo: redirige a una página normal, no expone catálogo en esa ruta

# --------------------------------------------------------------------------- #
# Las fuentes que NO son SEPA se mudaron al repo de captura.
#
# Relevar precios es capturar, y la captura vive en `relevamiento_precios`
# porque un bug alla cuesta datos perdidos para siempre: el catalogo de una
# tienda no tiene historico. Estan en:
#
#     relevamiento_precios/config/fuentes_online.yaml
#     relevamiento_precios/src/precios/online/
#
# Lo que queda aca arriba es lo que usa `scripts/sondeo_online.py`, que no
# releva: compara un catalogo contra lo que esa misma cadena le declaro a SEPA.
# Eso es analisis y por eso se queda.
# --------------------------------------------------------------------------- #
